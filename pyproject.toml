[project]
name = "reel-liseer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "HamzaSyrage", email = "hamzasyrage@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "imageio-ffmpeg>=0.6.0",
    "python-dotenv>=1.2.3",
    "python-telegram-bot>=22.8",
    "uvicorn>=0.53.0",
    "yt-dlp[curl-cffi,default]>=2026.8.19",
]

[project.scripts]
reel-liseer = "reel_liseer:main"

[dependency-groups]
dev = [
    "ruff>=0.14.0",
]

[tool.fastapi]
entrypoint = "src/reel_liseer.webapp:app"

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["E501", "E402"]

[tool.ruff.lint.isort]
# main.py must keep the reel_liseer imports below its sys.path bootstrap so
# `python src/reel_liseer/main.py` keeps working.
combine-as-imports = true

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
